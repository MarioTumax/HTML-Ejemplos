<!-- Informa al navegador que contiene un archivo HTML-->
<!DOCTYPE html>
<!-- Indica el idioma principal del contenido de la web (en = ingles es= español)-->
<html lang="es">
<!-- Cabera de nuestro archivo HTML-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo de nuestro archivo HTML-->
    <title>Etiquetas BR </title>
</head>
<!-- Body cuerpo de nuestro archivo HTML-->
<body>
    PHP <br>
    JavaScript <br>
    Java <br>
    c <br>
    C++ <br>
    Python <br>
    Cobol <br>
    Go <br>
</body>
</html>
